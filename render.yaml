# Render preview Blueprint. Review free-tier limits in backend/docs/deployment-render.md.
services:
  - type: keyvalue
    name: shortlink-redis
    region: oregon
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: off

  - type: web
    name: shortlink-api
    runtime: docker
    plan: free
    region: oregon
    autoDeployTrigger: off
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: /bin/sh -c 'npm run db:migrate && node dist/main.js'
    healthCheckPath: /health/live
    maxShutdownDelaySeconds: 120
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: shortlink-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: shortlink-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_ISSUER
        value: shortlink-api
      - key: JWT_AUDIENCE
        value: shortlink-dashboard
      - key: PORT
        value: "10000"
      - key: PUBLIC_BASE_URL
        fromService:
          name: shortlink-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ORIGINS
        fromService:
          name: shortlink-dashboard
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: REDIS_CONNECT_TIMEOUT_MS
        value: "5000"
      - key: REDIS_COMMAND_TIMEOUT_MS
        value: "3000"
      - key: REDIS_MAX_RETRIES_PER_REQUEST
        value: "1"
      - key: REDIS_RETRY_MAX_ATTEMPTS
        value: "5"
      - key: REDIS_RETRY_DELAY_MS
        value: "250"
      - key: REDIS_SHUTDOWN_TIMEOUT_MS
        value: "3000"
      - key: CACHE_MAX_TTL_SECONDS
        value: "3600"
      - key: REDIRECT_CACHE_ENABLED
        value: "true"
      - key: RATE_LIMIT_MAX
        value: "20"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: LOGIN_RATE_LIMIT_MAX
        value: "10"
      - key: LOGIN_RATE_LIMIT_WINDOW_SECONDS
        value: "900"
      - key: QUEUE_BATCH_SIZE
        value: "100"
      - key: QUEUE_MAX_ATTEMPTS
        value: "8"
      - key: QUEUE_RETRY_DELAY_MS
        value: "1000"
      - key: QUEUE_CLAIM_IDLE_MS
        value: "30000"
      - key: WORKER_HEARTBEAT_INTERVAL_MS
        value: "5000"
      - key: WORKER_HEARTBEAT_TTL_SECONDS
        value: "30"
      - key: PAGE_SIZE_DEFAULT
        value: "20"
      - key: PAGE_SIZE_MAX
        value: "100"

  - type: worker
    name: shortlink-click-worker
    runtime: docker
    plan: 0.5c-512mb
    region: oregon
    autoDeployTrigger: off
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: node dist/worker.js
    maxShutdownDelaySeconds: 120
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: shortlink-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: shortlink-redis
          type: keyvalue
          property: connectionString
      - key: REDIS_CONNECT_TIMEOUT_MS
        value: "5000"
      - key: REDIS_COMMAND_TIMEOUT_MS
        value: "3000"
      - key: REDIS_MAX_RETRIES_PER_REQUEST
        value: "1"
      - key: REDIS_RETRY_MAX_ATTEMPTS
        value: "5"
      - key: REDIS_RETRY_DELAY_MS
        value: "250"
      - key: REDIS_SHUTDOWN_TIMEOUT_MS
        value: "3000"
      - key: QUEUE_BATCH_SIZE
        value: "100"
      - key: QUEUE_WORKER_CONCURRENCY
        value: "2"
      - key: QUEUE_MAX_ATTEMPTS
        value: "8"
      - key: QUEUE_RETRY_DELAY_MS
        value: "1000"
      - key: QUEUE_CLAIM_IDLE_MS
        value: "30000"
      - key: WORKER_HEARTBEAT_INTERVAL_MS
        value: "5000"
      - key: WORKER_HEARTBEAT_TTL_SECONDS
        value: "30"

  - type: web
    name: shortlink-dashboard
    runtime: static
    autoDeployTrigger: off
    buildCommand: npm ci --prefix frontend && npm run build --prefix frontend
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: shortlink-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:"

databases:
  - name: shortlink-db
    databaseName: shortlink
    user: shortlink
    plan: free
    region: oregon
    postgresVersion: "17"
    ipAllowList: []
